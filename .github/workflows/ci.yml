name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧的进行中任务，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 编码检查依赖 git ls-files，需要完整文件列表
          fetch-depth: 1

      - name: 安装 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 放在最前面：编码问题会污染后续所有步骤的排查
      - name: 编码检查（防中文乱码）
        run: npm run check:encoding

      - name: 题库结构校验
        run: npm run validate:data

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build

      - name: 子目录构建（BASE_PATH）
        run: npm run build
        env:
          BASE_PATH: /ops/

      - name: 校验构建产物完整
        run: |
          set -e
          test -f dist/index.html                      || { echo "缺少 index.html"; exit 1; }
          # 运行时数据：索引 + 答案分片（questions.json 是编辑期源数据，构建时已剔除）
          test -f dist/data/questions-index.json       || { echo "缺少题库索引"; exit 1; }
          test -f dist/data/answers/manifest.json      || { echo "缺少分片清单"; exit 1; }
          # 大分类会被拆成多片（如 k8s-1/k8s-2），所以断言 manifest 里列出的分片都真实存在
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("dist/data/answers/manifest.json","utf8"));
            let n=0;
            for (const [cat,meta] of Object.entries(m)) {
              for (const s of meta.slugs) {
                const p="dist/data/answers/"+s+".json";
                if(!fs.existsSync(p)){ console.error("缺少分片 "+p+"（分类 "+cat+"）"); process.exit(1); }
                n++;
              }
            }
            console.log("✓ 分片齐全："+n+" 个文件，"+Object.keys(m).length+" 个分类");
          '
          # 源数据不应被部署（它 4.3 MB，只用于编辑期）
          test ! -f dist/data/questions.json           || { echo "questions.json 不应出现在 dist"; exit 1; }
          # PWA 产物：Service Worker、manifest、图标（缺了就无法离线 / 无法安装）
          test -f dist/sw.js                           || { echo "缺少 sw.js（PWA 未生效）"; exit 1; }
          test -f dist/manifest.webmanifest            || { echo "缺少 PWA manifest"; exit 1; }
          test -f dist/icon-192.png                    || { echo "缺少 192 图标"; exit 1; }
          test -f dist/icon-512.png                    || { echo "缺少 512 图标"; exit 1; }
          # iOS「添加到主屏幕」只认 apple-touch-icon，缺了 iOS 桌面图标会变成页面截图
          test -f dist/apple-touch-icon.png             || { echo "缺少 apple-touch-icon（iOS 主屏图标会退化成截图）"; exit 1; }
          grep -q 'apple-touch-icon' dist/index.html    || { echo "index.html 未引用 apple-touch-icon"; exit 1; }
          # sw.js 必须预缓存题库数据，否则「离线能打开但点进去没答案」
          grep -q 'questions-index.json' dist/sw.js    || { echo "sw.js 未预缓存题库索引"; exit 1; }
          grep -q 'answers' dist/sw.js                 || { echo "sw.js 未预缓存答案分片"; exit 1; }
          ls dist/assets/*.js >/dev/null 2>&1          || { echo "缺少 JS 产物"; exit 1; }
          ls dist/assets/*.css >/dev/null 2>&1         || { echo "缺少 CSS 产物"; exit 1; }
          grep -q '/ops/assets/' dist/index.html       || { echo "BASE_PATH 未生效"; exit 1; }
          echo "✓ 构建产物完整，BASE_PATH 生效，源数据已剔除，PWA 已预缓存数据"

      # 上传构建产物，方便在 Actions 页直接下载部署
      - name: 上传构建产物
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
