name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧的进行中任务，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 编码检查依赖 git ls-files，需要完整文件列表
          fetch-depth: 1

      - name: 安装 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 放在最前面：编码问题会污染后续所有步骤的排查
      - name: 编码检查（防中文乱码）
        run: npm run check:encoding

      - name: 题库结构校验
        run: npm run validate:data

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build

      - name: 子目录构建（BASE_PATH）
        run: npm run build
        env:
          BASE_PATH: /ops/

      - name: 校验构建产物完整
        run: |
          set -e
          test -f dist/index.html                      || { echo "缺少 index.html"; exit 1; }
          # 运行时数据：索引 + 答案分片（questions.json 是编辑期源数据，构建时已剔除）
          test -f dist/data/questions-index.json       || { echo "缺少题库索引"; exit 1; }
          test -f dist/data/answers/manifest.json      || { echo "缺少分片清单"; exit 1; }
          # 大分类会被拆成多片（如 k8s-1/k8s-2），所以断言 manifest 里列出的分片都真实存在
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("dist/data/answers/manifest.json","utf8"));
            let n=0;
            for (const [cat,meta] of Object.entries(m)) {
              for (const s of meta.slugs) {
                const p="dist/data/answers/"+s+".json";
                if(!fs.existsSync(p)){ console.error("缺少分片 "+p+"（分类 "+cat+"）"); process.exit(1); }
                n++;
              }
            }
            console.log("✓ 分片齐全："+n+" 个文件，"+Object.keys(m).length+" 个分类");
          '
          # 源数据不应被部署（它 4.3 MB，只用于编辑期）
          test ! -f dist/data/questions.json           || { echo "questions.json 不应出现在 dist"; exit 1; }
          # PWA 产物：Service Worker、manifest、图标（缺了就无法离线 / 无法安装）
          test -f dist/sw.js                           || { echo "缺少 sw.js（PWA 未生效）"; exit 1; }
          test -f dist/manifest.webmanifest            || { echo "缺少 PWA manifest"; exit 1; }
          test -f dist/icon-192.png                    || { echo "缺少 192 图标"; exit 1; }
          test -f dist/icon-512.png                    || { echo "缺少 512 图标"; exit 1; }
          # iOS「添加到主屏幕」只认 apple-touch-icon，缺了 iOS 桌面图标会变成页面截图
          test -f dist/apple-touch-icon.png             || { echo "缺少 apple-touch-icon（iOS 主屏图标会退化成截图）"; exit 1; }
          grep -q 'apple-touch-icon' dist/index.html    || { echo "index.html 未引用 apple-touch-icon"; exit 1; }
          # ---- PWA 缓存断言（2026-11 架构：外壳预缓存 + 分片运行时缓存）----
          #
          # ① 索引必须仍在 precache，否则「离线能打开但列表空白」
          grep -q 'questions-index.json' dist/sw.js    || { echo "sw.js 未预缓存题库索引（离线打不开列表）"; exit 1; }
          # ② 答案分片必须有运行时缓存规则，否则「离线能打开但点进去没答案」
          grep -q 'answers-shards' dist/sw.js          || { echo "sw.js 缺少答案分片的运行时缓存规则（离线点进去没答案）"; exit 1; }
          grep -q 'CacheFirst' dist/sw.js              || { echo "sw.js 缺少 CacheFirst 策略"; exit 1; }
          # ②b 缓存名必须带构建时间戳，否则用户会永久停在旧题库 ——
          #     2026-11 真实事故：固定 cacheName + 365 天保留期，导致
          #     用户手机上的答案分片一年不回源，索引更新了但题目内容还是旧的。
          grep -Eq 'answers-shards-[0-9]{10,}' dist/sw.js \
            || { echo "分片缓存名未带构建时间戳，用户会永久停在旧题库（见 deployment.md 的事故记录）"; exit 1; }
          # ②c version.json 不能进 precache，且必须有 NetworkOnly 规则 ——
          #     它是「存量用户能否发现自己该更新」的探针，被缓存就完全失效
          test -f dist/data/version.json                   || { echo "缺少 data/version.json（版本探针）"; exit 1; }
          if grep -q 'url:"data/version.json' dist/sw.js; then
            echo "version.json 进了 precache，会导致版本探针永远读到旧值"
            exit 1
          fi
          grep -q 'NetworkOnly' dist/sw.js                 || { echo "version.json 缺少 NetworkOnly 规则"; exit 1; }
          # ②d 题库索引的 revision 不能是 null ——
          #     否则 SW 升级也不会重新下载索引，用户会看到「版本号是新的但题库是旧的」
          #     （2026-11 真实事故，见 deployment.md）
          if grep -q 'url:"data/questions-index.json",revision:null' dist/sw.js; then
            echo "questions-index.json 的 revision 为 null，用户会永久停在旧题库"
            exit 1
          fi
          grep -Eq 'url:"data/questions-index\.json",revision:"[a-f0-9]+"' dist/sw.js \
            || { echo "questions-index.json 缺少内容哈希 revision"; exit 1; }
          # ③ 分片不能出现在 precache 清单里 —— 否则 SW 安装要吞 4.37 MB，
          #    发版后首次使用会明显卡顿（这正是 2026-11 修的问题）
          if grep -q 'url:"data/answers/' dist/sw.js; then
            echo "答案分片仍在 precache 里，会导致发版后首次使用卡顿"
            exit 1
          fi
          ls dist/assets/*.js >/dev/null 2>&1          || { echo "缺少 JS 产物"; exit 1; }
          ls dist/assets/*.css >/dev/null 2>&1         || { echo "缺少 CSS 产物"; exit 1; }
          grep -q '/ops/assets/' dist/index.html       || { echo "BASE_PATH 未生效"; exit 1; }
          # ④ 版本号必须被注入到产物 —— 硬编码版本会让用户无法判断自己是哪个版本
          #    （2026-11 事故：设置页写死 '0.3.0'，与 package.json 的 0.1.0 对不上）
          #    产物里的形态是裸版本串（如 "1.0.0"），`v` 前缀是运行时拼的，所以不匹配 v 前缀
          VER="$(node -p "require('./package.json').version")"
          grep -rq "\"${VER}\"" dist/assets/*.js \
            || { echo "产物中未找到版本号 ${VER}，检查 vite define 是否生效"; exit 1; }
          echo "✓ 构建产物完整，BASE_PATH 生效，源数据已剔除，PWA 缓存名带版本，版本号 v${VER} 已注入"

      # 上传构建产物，方便在 Actions 页直接下载部署
      - name: 上传构建产物
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
