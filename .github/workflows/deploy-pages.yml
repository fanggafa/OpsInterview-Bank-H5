name: Deploy to GitHub Pages

on:
  # 只在 main 分支的 CI 通过后手动/自动触发
  push:
    branches: [main]
  workflow_dispatch:

# 允许本工作流向 Pages 发布
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，取消进行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Pages 产物
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 部署前的质量门禁：任一失败则不发布
      - name: 编码检查
        run: npm run check:encoding

      - name: 题库校验
        run: npm run validate:data

      - name: 单元测试
        run: npm run test

      - name: 构建（hash 路由 + 子路径）
        env:
          # GitHub Pages 项目站点的 URL 形如 https://<user>.github.io/<repo>/
          # 因此 base 必须是 /<repo>/，否则资源全部 404
          BASE_PATH: /${{ github.event.repository.name }}/
          # Pages 不支持服务器端 rewrite，必须用 hash 路由
          VITE_ROUTER_MODE: hash
        run: npm run build

      - name: 校验产物
        run: |
          set -e
          test -f dist/index.html || { echo "缺少 index.html"; exit 1; }
          # 运行时数据：索引 + 答案分片（questions.json 是编辑期源数据，构建时已剔除）
          test -f dist/data/questions-index.json  || { echo "缺少题库索引"; exit 1; }
          test -f dist/data/answers/manifest.json || { echo "缺少分片清单"; exit 1; }
          # 大分类会被拆成多片（如 k8s-1/k8s-2），所以断言 manifest 里列出的分片都真实存在
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("dist/data/answers/manifest.json","utf8"));
            let n=0;
            for (const [cat,meta] of Object.entries(m)) {
              for (const s of meta.slugs) {
                const p="dist/data/answers/"+s+".json";
                if(!fs.existsSync(p)){ console.error("缺少分片 "+p+"（分类 "+cat+"）"); process.exit(1); }
                n++;
              }
            }
            console.log("✓ 分片齐全："+n+" 个文件，"+Object.keys(m).length+" 个分类");
          '
          # 源数据不该被部署：它 4.3 MB，页面运行时完全不碰
          test ! -f dist/data/questions.json      || { echo "questions.json 不应出现在 dist"; exit 1; }
          # PWA 产物：Service Worker、manifest、图标（缺了就无法离线 / 无法安装）
          test -f dist/sw.js                      || { echo "缺少 sw.js（PWA 未生效）"; exit 1; }
          test -f dist/manifest.webmanifest       || { echo "缺少 PWA manifest"; exit 1; }
          test -f dist/icon-192.png               || { echo "缺少 192 图标"; exit 1; }
          test -f dist/icon-512.png               || { echo "缺少 512 图标"; exit 1; }
          # sw.js 必须预缓存题库数据，否则「离线能打开但点进去没答案」
          grep -q 'questions-index.json' dist/sw.js || { echo "sw.js 未预缓存题库索引"; exit 1; }
          grep -q 'answers' dist/sw.js            || { echo "sw.js 未预缓存答案分片"; exit 1; }
          grep -q "/${{ github.event.repository.name }}/assets/" dist/index.html \
            || { echo "BASE_PATH 未生效"; exit 1; }
          echo "✓ 产物校验通过（索引 + 分片齐全，源数据已剔除，PWA 已预缓存题库）"

      # 防止 GitHub Pages 的 Jekyll 处理干扰下划线开头的文件
      - name: 添加 .nojekyll
        run: touch dist/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 尚未在 Settings 中开启时，自动启用（否则会报
          # "Get Pages site failed ... Not Found"）
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
